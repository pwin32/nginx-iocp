name: IOCP Performance Gate

on:
  push:
    branches: [ 'fix/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Paired IOCP benchmark
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout candidate
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib

    - name: Install oha
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri https://github.com/hatoo/oha/releases/download/v1.16.0/oha-windows-amd64.exe `
          -OutFile oha.exe

    - name: Prepare workload
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path html -Force | Out-Null
        [IO.File]::WriteAllBytes('html\empty.gif', [byte[]](0..0))
        [IO.File]::WriteAllBytes('html\64k.bin', [byte[]]::new(65536))

    - name: Build candidate
      shell: msys2 {0}
      run: |
        ./auto/configure --builddir=objs-candidate \
          --with-cc=gcc --with-cc-opt='-O3 -march=x86-64 -mtune=generic' \
          --with-pcre --with-http_stub_status_module
        make -f objs-candidate/Makefile -j$(nproc)

    - name: Build control
      shell: msys2 {0}
      run: |
        git fetch origin master
        git worktree add ../nginx-control origin/master
        cd ../nginx-control
        ./auto/configure --builddir=objs-control \
          --with-cc=gcc --with-cc-opt='-O3 -march=x86-64 -mtune=generic' \
          --with-pcre --with-http_stub_status_module
        make -f objs-control/Makefile -j$(nproc)

    - name: Run paired benchmark
      shell: msys2 {0}
      env:
        FILTER_NODE_BIN: node
        NODE_BIN: node.exe
        MSYS_BASH: /usr/bin/bash
        REPEATS: 6
        WORKER_PROCESSES: 4
        CONNECTIONS: 48
        CLIENT_PROCESSES: 4
        OHA_WARMUP_DURATION: 2s
        OHA_DURATION: 7s
        BENCH_PATHS: /empty.gif /64k.bin
      run: |
        export OHA_BIN="$(cygpath -u "$GITHUB_WORKSPACE/oha.exe")"
        export RESULTS_DIR="$(cygpath -u "$GITHUB_WORKSPACE/perf-results")"
        candidate="$(cygpath -u "$GITHUB_WORKSPACE/objs-candidate/nginx.exe")"
        control="$(cygpath -u "$GITHUB_WORKSPACE/../nginx-control/objs-control/nginx.exe")"
        misc/win32-oha-compare.sh "$candidate" "$control" iocp candidate control

    - name: Enforce performance gate
      shell: pwsh
      run: node .\misc\validate-oha-gate.js .\perf-results\candidate-vs-control.jsonl

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iocp-performance-results
        path: perf-results
        retention-days: 30
