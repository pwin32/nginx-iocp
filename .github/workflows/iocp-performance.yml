name: IOCP Performance Gate

on:
  push:
    branches: [ 'fix/codex-review-fixes' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Paired IOCP benchmark
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout candidate
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib

    - name: Install oha
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri https://github.com/hatoo/oha/releases/download/v1.16.0/oha-windows-amd64.exe `
          -OutFile oha.exe

    - name: Build candidate
      shell: msys2 {0}
      run: |
        ./auto/configure --builddir=objs-candidate \
          --with-cc=gcc --with-cc-opt='-O3 -march=x86-64 -mtune=generic' \
          --with-pcre --with-http_stub_status_module
        make -f objs-candidate/Makefile -j$(nproc)
        gcc -O2 -o win32-process-times.exe misc/win32-process-times.c

    - name: Checkout control
      uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        path: nginx-control
        fetch-depth: 2

    - name: Remove only the cache from control
      shell: pwsh
      working-directory: nginx-control
      run: |
        $source = git show HEAD^:src/event/modules/ngx_iocp_module.c
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        [IO.File]::WriteAllText(
          "$PWD/src/event/modules/ngx_iocp_module.c",
          ($source -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

    - name: Build control
      shell: msys2 {0}
      run: |
        control_root="$(cygpath -u "$GITHUB_WORKSPACE/nginx-control")"
        cd "$control_root"
        ./auto/configure --builddir=objs-control \
          --with-cc=gcc --with-cc-opt='-O3 -march=x86-64 -mtune=generic' \
          --with-pcre --with-http_stub_status_module
        make -f objs-control/Makefile -j$(nproc)

    - name: Run paired benchmark
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
        $env:PROCESS_TIMES_PATH = "$PWD/win32-process-times.exe"
        .\misc\win32-oha-compare-ci.ps1 `
          -Candidate .\objs-candidate\nginx.exe `
          -Control .\nginx-control\objs-control\nginx.exe `
          -Oha .\oha.exe -Results .\perf-results

    - name: Enforce performance gate
      shell: pwsh
      run: |
        node .\misc\validate-oha-gate.js `
          .\perf-results\forward\candidate-vs-control.jsonl `
          .\perf-results\reverse\candidate-vs-control.jsonl
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iocp-performance-results
        path: perf-results
        retention-days: 30
